name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '${{ matrix.python }}', cache: pip}
      - run: python -m pip install -e ".[dev]"
      - run: pytest
      - run: coverage run -m pytest
      - run: coverage report --fail-under=90
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src/repoimmune
      - run: repoimmune validate examples/memory/cards/astropy-12907.json
      - run: repoimmune replay astropy-12907 --memory examples/memory

